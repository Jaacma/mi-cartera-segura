name: Mi Cartera - automático
on:
  schedule:
    - cron: "15 7 * * *"
    - cron: "0 18 * * 5"
  workflow_dispatch:
    inputs:
      task:
        description: "Tarea a ejecutar"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - both
          - deploy
  push:
    paths:
      - "docs/index.html"
      - "docs/app.js"
      - "docs/styles.css"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mi-cartera
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
      REPORT_SENDER_EMAIL: ${{ secrets.REPORT_SENDER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Elegir tarea
        id: task
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            task="deploy"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            task="${{ inputs.task }}"
          elif [[ "${{ github.event.schedule }}" == "0 18 * * 5" ]]; then
            task="both"
          else
            task="daily"
          fi
          echo "value=$task" >> "$GITHUB_OUTPUT"
      - name: Actualizar cartera o enviar informe
        if: steps.task.outputs.value != 'deploy'
        run: node scripts/update.mjs
        env:
          TASK: ${{ steps.task.outputs.value }}
      - name: Guardar datos cifrados
        if: steps.task.outputs.value == 'daily' || steps.task.outputs.value == 'both'
        run: |
          git config user.name "mi-cartera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/portfolio.enc.json
          git diff --cached --quiet || git commit -m "Actualización automática cifrada"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
