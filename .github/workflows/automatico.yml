name: Mi Cartera - automático
on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mi-cartera
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DASHBOARD_KEY: ${{ secrets.DASHBOARD_KEY }}
      EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Elegir tarea
        id: task
        shell: bash
        run: echo "value=daily" >> "$GITHUB_OUTPUT"
      - name: Actualizar cartera o enviar informe
        run: node scripts/update.mjs
        env:
          TASK: ${{ steps.task.outputs.value }}
      - name: Guardar datos cifrados
        run: |
          git config user.name "mi-cartera-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/portfolio.enc.json
          git diff --cached --quiet || git commit -m "Actualización diaria cifrada"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: docs}
      - id: deployment
        uses: actions/deploy-pages@v4
